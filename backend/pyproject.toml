[project]
name = "magpie-api"
version = "0.1.0"
description = "Backend for Magpie, a slowly curated library of art"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pillow>=11.0",
    "anthropic>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
